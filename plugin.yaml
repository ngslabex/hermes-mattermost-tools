name: mattermost-tools
label: Mattermost Tools
kind: backend
version: 0.2.0

description: >
  Agent-callable Mattermost tools for Hermes. Supports sending messages,
  reading channel and direct-message history, listing channels and users,
  and opening direct-message conversations. The mm_read tool supports
  standard posts, attachment-only webhook posts, Slack-compatible
  attachments, and Mattermost blocks. Requires MATTERMOST_URL and
  MATTERMOST_TOKEN to be available in the Hermes process environment.

author: hermes-mattermost-tools contributors

provides_tools:
  - mm_send
  - mm_read
  - mm_list_channels
  - mm_list_users
  - mm_open_dm

requires_env:
  - name: MATTERMOST_URL
    description: "Mattermost server URL, for example https://mm.example.com"
    password: false

  - name: MATTERMOST_TOKEN
    description: "Mattermost bot account token or personal access token"
    password: true
